<title>당근 피하기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: one centered play field (garden bed), score strip above, controls below */
  :root {
    --sky: #dff0f7;
    --sky-low: #f6efd9;
    --soil: #7a4e2d;
    --soil-dark: #5b3820;
    --ink: #2f2418;
    --muted: #6d6152;
    --carrot: #f07a1a;
    --leaf: #3f9a3a;
    --panel: #fffaf0;
    --line: #e2d6bd;
    --heart: #e5484d;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky: #1b2433; --sky-low: #2b2a33; --soil: #4a3221; --soil-dark: #34231a;
      --ink: #f3ead9; --muted: #b3a690; --carrot: #ff8a2a; --leaf: #5cbf55;
      --panel: #242019; --line: #3d362b; --heart: #ff6369; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky: #1b2433; --sky-low: #2b2a33; --soil: #4a3221; --soil-dark: #34231a;
    --ink: #f3ead9; --muted: #b3a690; --carrot: #ff8a2a; --leaf: #5cbf55;
    --panel: #242019; --line: #3d362b; --heart: #ff6369; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--panel); color: var(--ink); font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 0; color: var(--carrot); letter-spacing: -0.5px; }
  .stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
  .stats b { font-family: var(--display); font-weight: 400; color: var(--ink); font-size: 18px; }
  .hearts { color: var(--heart); font-size: 18px; letter-spacing: 2px; min-width: 3.6em; text-align: right; }
  .field { position: relative; flex: 1; min-height: 0; display: flex; justify-content: center; }
  canvas { display: block; border-radius: 14px; border: 2px solid var(--line); max-width: 100%; max-height: 100%; aspect-ratio: 2 / 3; height: auto; width: 100%; object-fit: contain; touch-action: none; background: var(--sky); }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; text-align: center; padding: 24px;
  }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 290px; }
  .card h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; text-wrap: balance; }
  .card p { margin: 0; line-height: 1.6; color: var(--muted); font-size: 14px; }
  .big { font-family: var(--display); font-size: 44px; color: var(--carrot); line-height: 1; font-variant-numeric: tabular-nums; }
  button {
    font-family: var(--display); font-size: 20px; border: none; border-radius: 12px; cursor: pointer;
    background: var(--carrot); color: #fff; padding: 10px 26px; box-shadow: 0 4px 0 var(--soil-dark);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--soil-dark); }
  button:focus-visible { outline: 3px solid var(--leaf); outline-offset: 3px; }
  .pad { display: flex; gap: 10px; }
  .pad button { flex: 1; font-size: 24px; padding: 12px; background: var(--soil); }
  .hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
  @media (hover: hover) and (pointer: fine) { .pad { display: none; } }
</style>

<div class="wrap">
  <header>
    <h1>당근 피하기</h1>
    <div class="stats">
      <span>점수 <b id="score">0.0</b></span>
      <span>최고 <b id="best">0.0</b></span>
      <span class="hearts" id="hearts" aria-label="남은 목숨">♥♥♥</span>
    </div>
  </header>

  <div class="field">
    <canvas id="game" width="400" height="600" aria-label="게임 화면"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovTitle">하늘에서 당근이 쏟아진다!</h2>
        <div class="big" id="ovScore" hidden></div>
        <p id="ovText">당근이 정말 싫은 아이를 좌우로 움직여 떨어지는 당근을 피하세요. 목숨은 3개, 버틴 시간이 점수예요.</p>
        <button id="startBtn" type="button">시작하기</button>
      </div>
    </div>
  </div>

  <div class="pad">
    <button id="leftBtn" type="button" aria-label="왼쪽">◀</button>
    <button id="rightBtn" type="button" aria-label="오른쪽">▶</button>
  </div>
  <p class="hint">← → 또는 A / D 키로 이동 · 화면을 드래그해도 돼요 · P 일시정지</p>
</div>

<script>
(() => {
  const W = 400, H = 600, GROUND = H - 56;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const scoreEl = $('score'), bestEl = $('best'), heartsEl = $('hearts');
  const overlay = $('overlay'), ovTitle = $('ovTitle'), ovText = $('ovText'), ovScore = $('ovScore'), startBtn = $('startBtn');

  // Hi-DPI backing store
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let colors = {};
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['sky', 'sky-low', 'soil', 'soil-dark', 'ink', 'carrot', 'leaf', 'heart', 'panel'])
      colors[k] = cs.getPropertyValue('--' + k).trim();
  }
  readColors();
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', readColors);

  let best = 0;
  try { best = parseFloat(localStorage.getItem('carrot-best')) || 0; } catch (e) {}
  bestEl.textContent = best.toFixed(1);

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const keys = { left: false, right: false };
  let state = 'ready'; // ready | play | pause | over
  let player, carrots, particles, t, spawnTimer, lives, invuln, shake, pointerX;

  function reset() {
    player = { x: W / 2, y: GROUND - 30, r: 22, vx: 0, face: 0 };
    carrots = []; particles = [];
    t = 0; spawnTimer = 0.6; lives = 3; invuln = 0; shake = 0; pointerX = null;
    updateHud();
  }

  function updateHud() {
    scoreEl.textContent = t.toFixed(1);
    heartsEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
  }

  function spawn() {
    const big = Math.random() < Math.min(0.08 + t * 0.006, 0.3);
    const len = big ? 74 : 44 + Math.random() * 16;
    carrots.push({
      x: 20 + Math.random() * (W - 40),
      y: -len,
      len, w: len * 0.36,
      vy: 150 + t * 7 + Math.random() * 90,
      vx: t > 20 ? (Math.random() - 0.5) * Math.min(t * 2, 80) : 0,
      rot: (Math.random() - 0.5) * 0.4,
      spin: (Math.random() - 0.5) * 2,
    });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 200;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.6 + Math.random() * 0.4, color });
    }
  }

  function update(dt) {
    t += dt;

    // movement
    const accel = 2600, maxV = 330;
    let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (pointerX !== null && dir === 0) {
      const dx = pointerX - player.x;
      dir = Math.abs(dx) < 6 ? 0 : Math.sign(dx);
      if (Math.abs(dx) < 40) player.vx = dx * 8;
    }
    if (dir) player.vx += dir * accel * dt;
    else player.vx *= Math.pow(0.0005, dt);
    player.vx = Math.max(-maxV, Math.min(maxV, player.vx));
    player.x += player.vx * dt;
    if (player.x < player.r) { player.x = player.r; player.vx = 0; }
    if (player.x > W - player.r) { player.x = W - player.r; player.vx = 0; }
    player.face += (Math.max(-1, Math.min(1, player.vx / 200)) - player.face) * Math.min(1, dt * 10);

    // spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = Math.max(0.16, 0.75 - t * 0.018) * (0.6 + Math.random() * 0.8);
    }

    // carrots
    for (const c of carrots) {
      c.y += c.vy * dt; c.x += c.vx * dt; c.rot += c.spin * dt;
      if (c.x < 10 || c.x > W - 10) c.vx *= -1;
      // hitbox: circle around the thick part of the carrot
      const hx = c.x, hy = c.y - c.len * 0.1, hr = c.w * 0.55;
      if (invuln <= 0 && Math.hypot(hx - player.x, hy - player.y) < hr + player.r * 0.85) {
        c.hit = true;
        lives--; invuln = 1.2; shake = reduceMotion ? 0 : 10;
        burst(hx, hy, colors.carrot, 18);
        if (lives <= 0) { updateHud(); return gameOver(); }
      }
      if (!c.hit && c.y - c.len * 0.5 > GROUND) {
        c.hit = true;
        burst(c.x, GROUND, colors.soil, 6);
      }
    }
    carrots = carrots.filter(c => !c.hit);

    for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
    particles = particles.filter(p => p.life > 0);

    if (invuln > 0) invuln -= dt;
    shake *= Math.pow(0.001, dt);
    updateHud();
  }

  // ---------- drawing ----------
  function drawCarrot(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    const L = c.len, w = c.w;
    // leaves (top)
    ctx.fillStyle = colors.leaf;
    for (const a of [-0.45, 0, 0.45]) {
      ctx.save();
      ctx.translate(0, -L * 0.48);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -L * 0.14, w * 0.18, L * 0.16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // body: rounded top, pointed tip at bottom
    ctx.fillStyle = colors.carrot;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -L * 0.42);
    ctx.quadraticCurveTo(0, -L * 0.58, w / 2, -L * 0.42);
    ctx.quadraticCurveTo(w * 0.42, L * 0.1, 0, L * 0.5);
    ctx.quadraticCurveTo(-w * 0.42, L * 0.1, -w / 2, -L * 0.42);
    ctx.fill();
    // ridges
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const y = -L * 0.25 + i * L * 0.18, half = w * (0.36 - i * 0.08);
      const side = i % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(side * half, y);
      ctx.lineTo(side * (half - w * 0.22), y + 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlayer() {
    if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) return;
    const { x, y, r, face } = player;
    const scared = carrots.some(c => Math.abs(c.x - x) < 60 && c.y > y - 200 && c.y < y);
    ctx.save();
    ctx.translate(x, y);
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(0, GROUND - y + 4, r * 0.9, 5, 0, 0, Math.PI * 2); ctx.fill();
    // body
    ctx.fillStyle = '#3b7dd8';
    ctx.beginPath(); ctx.roundRect(-r * 0.7, r * 0.55, r * 1.4, r * 0.95, 8); ctx.fill();
    // head
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    // hair
    ctx.fillStyle = '#3a2618';
    ctx.beginPath(); ctx.arc(0, -2, r, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    // eyes
    const ex = face * 4;
    ctx.fillStyle = '#2a1d12';
    if (scared) {
      ctx.lineWidth = 2; ctx.strokeStyle = '#2a1d12';
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(ex + s * 8 - 3, 0); ctx.lineTo(ex + s * 8 + 3, 3); ctx.lineTo(ex + s * 8 - 3, 6);
        if (s > 0) { ctx.moveTo(ex + s * 8 + 3, 0); ctx.lineTo(ex + s * 8 - 3, 3); ctx.lineTo(ex + s * 8 + 3, 6); }
        ctx.stroke();
      }
    } else {
      ctx.beginPath(); ctx.arc(ex - 8, 2, 2.6, 0, Math.PI * 2); ctx.arc(ex + 8, 2, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    // mouth: wavy "yuck"
    ctx.strokeStyle = '#2a1d12'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(ex - 7, 13);
    ctx.quadraticCurveTo(ex - 3.5, 9, ex, 13);
    ctx.quadraticCurveTo(ex + 3.5, 17, ex + 7, 13);
    ctx.stroke();
    // cheeks
    ctx.fillStyle = 'rgba(240,120,120,0.45)';
    ctx.beginPath(); ctx.arc(ex - 14, 9, 3.5, 0, Math.PI * 2); ctx.arc(ex + 14, 9, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawScene() {
    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, colors.sky); g.addColorStop(1, colors['sky-low']);
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, GROUND + 20);
    // soil with furrows
    ctx.fillStyle = colors.soil;
    ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
    ctx.fillStyle = colors['soil-dark'];
    for (let i = 0; i < 9; i++) ctx.fillRect(-10 + i * 50, GROUND + 18 + (i % 2) * 14, 30, 4);
    // grass line
    ctx.fillStyle = colors.leaf;
    ctx.fillRect(-20, GROUND - 3, W + 40, 6);

    for (const c of carrots) drawCarrot(c);
    drawPlayer();
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // ---------- loop & states ----------
  let last = 0;
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0);
    last = now;
    if (state === 'play') update(dt);
    drawScene();
    requestAnimationFrame(frame);
  }

  function showOverlay(title, text, btn, score) {
    ovTitle.textContent = title; ovText.textContent = text; startBtn.textContent = btn;
    ovScore.hidden = score === undefined;
    if (score !== undefined) ovScore.textContent = score;
    overlay.hidden = false;
    startBtn.focus();
  }

  function start() {
    if (state === 'pause') { state = 'play'; overlay.hidden = true; return; }
    reset();
    state = 'play';
    overlay.hidden = true;
  }

  function gameOver() {
    state = 'over';
    const s = t;
    let msg = '당근에 세 번 맞았어요.';
    if (s > best) {
      best = s; bestEl.textContent = best.toFixed(1);
      try { localStorage.setItem('carrot-best', String(best)); } catch (e) {}
      msg = '새 최고 기록이에요!';
    }
    showOverlay('으악, 당근이다!', msg, '다시 하기', s.toFixed(1) + '초');
  }

  function pause() {
    if (state === 'play') { state = 'pause'; showOverlay('일시정지', '당근이 잠시 공중에 멈췄어요.', '계속하기'); }
    else if (state === 'pause') start();
  }

  startBtn.addEventListener('click', start);

  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
  addEventListener('keydown', e => {
    if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; pointerX = null; e.preventDefault(); }
    else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') pause();
    else if ((e.key === ' ' || e.key === 'Enter') && state !== 'play' && document.activeElement !== startBtn) { start(); e.preventDefault(); }
  });
  addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
  addEventListener('blur', () => { keys.left = keys.right = false; if (state === 'play') pause(); });

  // pointer drag on the canvas
  function toGameX(e) { const r = canvas.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
  canvas.addEventListener('pointerdown', e => { pointerX = toGameX(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') pointerX = toGameX(e); });
  const release = () => { pointerX = null; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  // on-screen buttons for phones
  for (const [id, k] of [['leftBtn', 'left'], ['rightBtn', 'right']]) {
    const b = $(id);
    b.addEventListener('pointerdown', e => { keys[k] = true; b.setPointerCapture(e.pointerId); e.preventDefault(); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, () => { keys[k] = false; });
  }

  reset();
  // a few carrots in the sky so the first frame shows the game
  for (let i = 0; i < 5; i++) { spawn(); carrots[i].y = 60 + i * 85; }
  requestAnimationFrame(frame);
})();
</script>
